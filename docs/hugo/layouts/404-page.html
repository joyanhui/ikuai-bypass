<!doctype html>
<html lang="{{ .Site.Language.Lang | default "zh" }}" dir="{{ partial "utils/hugo-compat/language-direction.html" .Site.Language | default "ltr" }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 - 页面未找到</title>
  </head>
  <body
    style='font-family:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji"; height:100vh; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:0'
  >
    <main id="content">
      <style>
        body { color: #000; background: #fff; }
        @media (prefers-color-scheme: dark) { body { color: #fff; background: #000; } }
        .hx-err-code { border-right: 1px solid rgba(128,128,128,.4); }
      </style>
      <h1
        class="hx-err-code"
        style='display:inline-block; margin:0 20px 0 0; padding-right:23px; font-size:24px; font-weight:500; vertical-align:top; line-height:49px;'
      >404</h1>
      <div style="display:inline-block; text-align:left">
        <h2 style="font-size:14px; font-weight:400; line-height:49px; margin:0">抱歉，您访问的页面不存在或已被移动。</h2>
        <p style="font-size:13px; line-height:1.6;">
          <a href="{{ .Site.BaseURL }}" style="color:#0b7285; text-decoration:underline;">返回文档首页</a>
        </p>
      </div>
    </main>
  </body>
</html>
